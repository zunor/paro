[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paro-runtime-worker"
version = "0.1.0"
description = "Paro internal Python runtime worker"
requires-python = ">=3.11"

[project.scripts]
paro-runtime-worker = "paro_runtime_worker.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
