[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paro-udf"
version = "0.1.0"
description = "Paro user-facing Python UDF SDK"
requires-python = ">=3.11"
optional-dependencies = { numpy = ["numpy>=2"], arrow = ["pyarrow>=16"], dev = [] }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
