[package]
name = "paro-common"
version = { workspace = true }
edition = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[features]
default = []
debug-allocation = []
## Install-time allocation accounting is intentionally opt-in.  The planner
## can still use the scoped API in every build; without this feature the API is
## a zero-cost no-op and production binaries remain free to select jemalloc or
## another allocator.
alloc-metrics = []
test-support = []

[dependencies]
thiserror = { workspace = true }
bytes = { workspace = true }

# Configuration system
serde = { workspace = true }
figment = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
bytesize = { workspace = true }
humantime-serde = { workspace = true }
bincode = { workspace = true }
crc32c = "0.6"
memchr = "2.7"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
