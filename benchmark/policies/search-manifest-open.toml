schema_version = 1
name = "search-manifest-open"
version = 1
enforcement = "shadow"

[[sources]]
name = "search-manifest-open"
type = "divan_bench"
crate = "paro-storage"
bench = "search_manifest_open"
measurement_class = "rust_micro"
required = true

[metrics]
required = [
  "p50",
  "p99",
  "throughput_per_second",
  "audit_manifest_open_bytes_total_p99",
  "audit_manifest_open_fragment_count_p99",
  "audit_manifest_open_shard_count_p99",
  "audit_manifest_open_delta_count_p99",
]

[thresholds]
latency_regression_percent = 10.0
throughput_min_ratio = 0.90

[noise_floors]
latency_ms = 0.0
p99_latency_ms = 0.0
short_query_latency_ms = 0.0
short_query_max_p50_ms = 0.0
tail_sample_min_count = 50
resource_kb = 0.0
rss_kb = 0.0

[absolute_max]
"manifest_open_json_32_shards_32_deltas.p99" = 5.0
"manifest_open_binary_32_shards_32_deltas.p99" = 0.5
"manifest_open_json_32_shards_32_deltas.audit_manifest_open_fragment_count_p99" = 65.0
"manifest_open_binary_32_shards_32_deltas.audit_manifest_open_fragment_count_p99" = 65.0
"manifest_open_json_32_shards_32_deltas.audit_manifest_open_shard_count_p99" = 32.0
"manifest_open_binary_32_shards_32_deltas.audit_manifest_open_shard_count_p99" = 32.0
"manifest_open_json_32_shards_32_deltas.audit_manifest_open_delta_count_p99" = 32.0
"manifest_open_binary_32_shards_32_deltas.audit_manifest_open_delta_count_p99" = 32.0
"audit_manifest_open_bytes_total_p99" = 268435456.0

[absolute_min]

[statistics]
model = "mann_whitney_rolling_p95_holm"
family_alpha_first_run = 0.05
family_alpha_confirmed = 0.01
false_positive_target = 0.02
true_positive_target = 0.95

[calibration]
source = "archive"
min_clean_observations_sql_macro = 30
min_clean_observations_rust_micro = 50
rolling_window_sql_macro = 30
rolling_window_rust_micro = 50
noise_floor_formula = "directional_rolling_p95_delta"

[coverage]
new_query_staging_days = 14
