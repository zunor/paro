schema_version = 1
name = "search-row-fetch"
version = 1
enforcement = "shadow"

[[sources]]
name = "search-row-fetch"
type = "divan_bench"
crate = "paro-storage"
bench = "search_row_fetch"
measurement_class = "rust_micro"
required = true

[metrics]
required = [
  "p50",
  "p99",
  "throughput_per_second",
  "audit_rows_p99",
  "audit_projected_columns_p99",
  "audit_column_batches_p99",
  "audit_fixed_width_column_batches_p99",
  "audit_varlen_column_batches_p99",
  "audit_column_read_by_rowids_page_run_seeks_p99",
  "audit_search_layer_varlen_fallback_seek_count_p99",
]

[thresholds]
latency_regression_percent = 10.0
resource_regression_percent = 20.0
throughput_min_ratio = 0.90

[noise_floors]
latency_ms = 0.0
p99_latency_ms = 0.0
short_query_latency_ms = 0.0
short_query_max_p50_ms = 0.0
tail_sample_min_count = 30
resource_kb = 0.0
rss_kb = 0.0

[absolute_max]
"row_fetch_128_candidates_fixed_varlen.audit_rows_p99" = 128.0
"row_fetch_128_candidates_fixed_varlen.audit_projected_columns_p99" = 2.0
"row_fetch_128_candidates_fixed_varlen.audit_column_batches_p99" = 2.0
"row_fetch_128_candidates_fixed_varlen.audit_fixed_width_column_batches_p99" = 1.0
"row_fetch_128_candidates_fixed_varlen.audit_varlen_column_batches_p99" = 1.0
"row_fetch_128_candidates_fixed_varlen.audit_column_read_by_rowids_page_run_seeks_p99" = 16.0
"row_fetch_128_candidates_fixed_varlen.audit_search_layer_varlen_fallback_seek_count_p99" = 0.0

[absolute_min]
"row_fetch_128_candidates_fixed_varlen.audit_rows_p99" = 128.0
"row_fetch_128_candidates_fixed_varlen.audit_projected_columns_p99" = 2.0
"row_fetch_128_candidates_fixed_varlen.audit_column_batches_p99" = 2.0
"row_fetch_128_candidates_fixed_varlen.audit_fixed_width_column_batches_p99" = 1.0
"row_fetch_128_candidates_fixed_varlen.audit_varlen_column_batches_p99" = 1.0

[statistics]
model = "mann_whitney_rolling_p95_holm"
family_alpha_first_run = 0.05
family_alpha_confirmed = 0.01
false_positive_target = 0.02
true_positive_target = 0.95

[calibration]
source = "archive"
min_clean_observations_sql_macro = 30
min_clean_observations_rust_micro = 30
rolling_window_sql_macro = 30
rolling_window_rust_micro = 30
noise_floor_formula = "directional_rolling_p95_delta"

[coverage]
new_query_staging_days = 14
