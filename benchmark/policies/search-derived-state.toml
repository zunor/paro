schema_version = 1
name = "search-derived-state"
version = 2
enforcement = "shadow"

[[sources]]
name = "search-derived-state-phase0-sql"
type = "sql_suite"
suite = "search-derived-state-phase0"
measurement_class = "sql_macro"
required = true

[metrics]
required = ["p50", "p99", "throughput_per_second", "rss_peak_kb"]

[thresholds]
latency_regression_percent = 15.0
resource_regression_percent = 25.0
throughput_min_ratio = 0.85

[noise_floors]
latency_ms = 1.0
p99_latency_ms = 3.0
short_query_latency_ms = 2.5
short_query_max_p50_ms = 20.0
tail_sample_min_count = 20
resource_kb = 0.0
rss_kb = 65536.0

[absolute_max]
"fulltext_topk.p99" = 150.0
"fulltext_project_payload.p99" = 150.0
"fulltext_project_fixed_payload.p99" = 150.0
"fulltext_project_low_cardinality_payload.p99" = 150.0
"fulltext_project_nullable_payload.p99" = 150.0
"fulltext_project_multi_payload.p99" = 150.0
"sparse_topk.p99" = 220.0
"hnsw_topk.p99" = 120.0

[absolute_min]
"fulltext_topk.throughput_per_second" = 5.0
"fulltext_project_payload.throughput_per_second" = 5.0
"fulltext_project_fixed_payload.throughput_per_second" = 5.0
"fulltext_project_low_cardinality_payload.throughput_per_second" = 5.0
"fulltext_project_nullable_payload.throughput_per_second" = 5.0
"fulltext_project_multi_payload.throughput_per_second" = 5.0
"sparse_topk.throughput_per_second" = 4.0
"hnsw_topk.throughput_per_second" = 8.0

[statistics]
model = "mann_whitney_rolling_p95_holm"
family_alpha_first_run = 0.05
family_alpha_confirmed = 0.01
false_positive_target = 0.02
true_positive_target = 0.95

[calibration]
source = "archive"
min_clean_observations_sql_macro = 30
min_clean_observations_rust_micro = 50
rolling_window_sql_macro = 30
rolling_window_rust_micro = 50
noise_floor_formula = "directional_rolling_p95_delta"

[coverage]
new_query_staging_days = 14
