schema_version = 1
name = "search-sidecar-open"
version = 1
enforcement = "shadow"

[[sources]]
name = "search-sidecar-open"
type = "divan_bench"
crate = "paro-storage"
bench = "search_sidecar_open"
measurement_class = "rust_micro"
required = true

[metrics]
required = [
  "p50",
  "p99",
  "throughput_per_second",
  "audit_sidecar_open_count_p99",
  "audit_sidecar_cache_miss_count_p99",
  "audit_sidecar_format_dispatch_count_p99",
  "audit_active_shard_count_p99",
]

[thresholds]
latency_regression_percent = 10.0
resource_regression_percent = 20.0
throughput_min_ratio = 0.90

[noise_floors]
latency_ms = 0.0
p99_latency_ms = 0.0
short_query_latency_ms = 0.0
short_query_max_p50_ms = 0.0
tail_sample_min_count = 30
resource_kb = 0.0
rss_kb = 0.0

[absolute_max]
"sidecar_reader_32_packages_4_artifacts.audit_sidecar_open_count_p99" = 32.0
"sidecar_reader_32_packages_4_artifacts.audit_active_shard_count_p99" = 32.0
"sidecar_reader_32_packages_4_artifacts.audit_sidecar_cache_miss_count_p99" = 128.0
"sidecar_reader_32_packages_4_artifacts.audit_sidecar_format_dispatch_count_p99" = 128.0

[absolute_min]

[statistics]
model = "mann_whitney_rolling_p95_holm"
family_alpha_first_run = 0.05
family_alpha_confirmed = 0.01
false_positive_target = 0.02
true_positive_target = 0.95

[calibration]
source = "archive"
min_clean_observations_sql_macro = 30
min_clean_observations_rust_micro = 30
rolling_window_sql_macro = 30
rolling_window_rust_micro = 30
noise_floor_formula = "directional_rolling_p95_delta"

[coverage]
new_query_staging_days = 14
