schema_version = 1
name = "search-foreground-io"
version = 1
enforcement = "shadow"

[[sources]]
name = "search-foreground-io"
type = "divan_bench"
crate = "paro-storage"
bench = "search_foreground_io"
measurement_class = "rust_micro"
required = true

[metrics]
required = [
  "p50",
  "p99",
  "throughput_per_second",
  "audit_foreground_baseline_ms_p99",
  "audit_foreground_contended_ms_p99",
  "audit_foreground_io_degradation_percent_p99",
  "audit_background_catch_up_read_bytes_p99",
  "audit_foreground_query_bytes_p99",
  "audit_foreground_reserved_bytes_p99",
  "audit_admitted_background_read_bytes_p99",
  "audit_oversized_background_deferred_p99",
]

[thresholds]
latency_regression_percent = 10.0
resource_regression_percent = 20.0
throughput_min_ratio = 0.90

[noise_floors]
latency_ms = 0.0
p99_latency_ms = 0.0
short_query_latency_ms = 0.0
short_query_max_p50_ms = 0.0
tail_sample_min_count = 30
resource_kb = 0.0
rss_kb = 0.0

[absolute_max]
"foreground_sidecar_io_with_bounded_catch_up.audit_foreground_io_degradation_percent_p99" = 30.0
"foreground_sidecar_io_with_bounded_catch_up.audit_background_catch_up_read_bytes_p99" = 131072.0
"foreground_sidecar_io_with_bounded_catch_up.audit_admitted_background_read_bytes_p99" = 131072.0
"foreground_sidecar_io_with_bounded_catch_up.audit_oversized_background_deferred_p99" = 1.0

[absolute_min]
"foreground_sidecar_io_with_bounded_catch_up.audit_foreground_query_bytes_p99" = 8388608.0
"foreground_sidecar_io_with_bounded_catch_up.audit_foreground_reserved_bytes_p99" = 786432.0
"foreground_sidecar_io_with_bounded_catch_up.audit_admitted_background_read_bytes_p99" = 131072.0
"foreground_sidecar_io_with_bounded_catch_up.audit_oversized_background_deferred_p99" = 1.0

[statistics]
model = "mann_whitney_rolling_p95_holm"
family_alpha_first_run = 0.05
family_alpha_confirmed = 0.01
false_positive_target = 0.02
true_positive_target = 0.95

[calibration]
source = "archive"
min_clean_observations_sql_macro = 30
min_clean_observations_rust_micro = 30
rolling_window_sql_macro = 30
rolling_window_rust_micro = 30
noise_floor_formula = "directional_rolling_p95_delta"

[coverage]
new_query_staging_days = 14
