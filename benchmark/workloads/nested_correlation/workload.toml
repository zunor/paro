[meta]
name = "nested_correlation"
description = "Planner-facing nested correlated subquery benchmarks using EXPLAIN-only queries"

[setup]
file = "sql/setup.sql"
teardown = "sql/teardown.sql"

[[query]]
id = "three_level_scalar_explain"
file = "sql/q_three_level_scalar_explain.sql"
validate = "text_contains_all"
expected = [
  "DELIM_JOIN",
  "Join Type: LEFT",
  "Output: (SELECT (SELECT d.score",
  "Aggregates: first(#1)",
  "Filter: #0 = #2",
]

[[query]]
id = "four_level_exists_explain"
file = "sql/q_four_level_exists_explain.sql"
validate = "text_contains_all"
expected = [
  "Join Type: MARK",
  "Join Condition: #1 IS NOT DISTINCT FROM #0, #2 IS NOT DISTINCT FROM #1",
  "Filter: #2 >= #1",
  "Aggregates: first(#2)",
]
