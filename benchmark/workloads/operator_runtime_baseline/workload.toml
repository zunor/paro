[meta]
name = "operator_runtime_baseline"
description = "BASELINE operator runtime baseline: scan, join, aggregate, sort, spill, and sort-range join"
run_order = 18

[params]
scan_rows = 100000
scan_key_space = 1000
int_join_rows = 5000
string_join_rows = 4000
agg_groups = 10000
ie_rows = 512
memory_limit = "256MB"
forced_memory_limit = "128MB"
temp_directory = "/tmp/paro_benchmark_operator_runtime_baseline"
random_seed = 20260525
thread_count = 1
fast_path_expected = "current-single-active-driver"

[setup]
file = "sql/setup.sql"
teardown = "sql/teardown.sql"

[[query]]
id = "selective_rowset_scan"
file = "sql/q_selective_rowset_scan.sql"
validate = "scalar_equals"
expected = 100
collect_explain_profile = true
allow_reexecute = true

