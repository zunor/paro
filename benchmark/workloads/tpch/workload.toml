[meta]
name = "tpch"
description = "TPC-H analytical query performance"
run_order = 90

[params]
data_dir = "/tmp/paro-tpch-data"
thread_count = 1
memory_limit = "2GB"
rowset_scan_pushdown = true

[setup]
file = "sql/setup.sql"
teardown = "sql/teardown.sql"

[[query]]
id = "q01_pricing_summary"
file = "sql/q01.sql"
validate = "ordered_rows"
expected = [
  ["A", "F", "37734107.00", "56586554400.73", "53758257134.8700", "55909065222.827692", "25.522006", "38273.129735", "0.049985", 1478493],
  ["N", "F", "991417.00", "1487504710.38", "1413082168.0541", "1469649223.194375", "25.516472", "38284.467761", "0.050093", 38854],
  ["N", "O", "74476040.00", "111701729697.74", "106118230307.6056", "110367043872.497010", "25.502227", "38249.117989", "0.049997", 2920374],
  ["R", "F", "37719753.00", "56568041380.90", "53741292684.6040", "55889619119.831932", "25.505794", "38250.854626", "0.050009", 1478870],
]
collect_explain_profile = true
allow_reexecute = true

[[query]]
id = "q06_forecast_revenue"
file = "sql/q06.sql"
validate = "scalar_equals"
expected = "123141078.2283"
collect_explain_profile = true
allow_reexecute = true

[[query]]
id = "q14_promotion_effect"
file = "sql/q14.sql"
