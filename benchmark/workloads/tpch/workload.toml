[meta]
name = "tpch"
description = "TPC-H analytical query performance"
run_order = 90
minimum_server_buffer_pool = "2GiB"

[params]
data_dir = "/tmp/paro-tpch-data"
thread_count = 4
memory_limit = "2GB"
rowset_scan_pushdown = true

