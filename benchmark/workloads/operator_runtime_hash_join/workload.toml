[meta]
name = "operator_runtime_hash_join"
description = "HASH-JOIN typed hash kernel, vectorized probe, and hash join layout benchmark"
run_order = 21

[params]
rows = 1000
long_rows = 512
long_key_space = 16
string_rows = 1000
null_rows = 1000
memory_limit = "256MB"
temp_directory = "/tmp/paro_benchmark_operator_runtime_hash_join"
random_seed = 20260525
thread_count = 1
fast_path_expected = "current-single-active-driver"

[setup]
file = "sql/setup.sql"
teardown = "sql/teardown.sql"

[[query]]
id = "i64_short_chain_left"
file = "sql/q_i64_short_chain_left.sql"
validate = "scalar_equals"
expected = 1000
plan_contains = ["HASH_JOIN"]
collect_explain_profile = true
allow_reexecute = true

