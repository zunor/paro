[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# External dependencies (verified stable versions - Dec 2024)
pgwire = "0.37"

arrow = "53.3"
parquet = "53.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
async-trait = "0.1"
bytes = "1.5"
futures = "0.3"
parking_lot = "0.12"
bincode = "1.3"

derive-visitor = { version = "0.4.0", features = ["std-types-drive"] }
educe = { version = "1.0.0", features = ["default", "full"], package = "databend_educe" }
enum-as-inner = "0.6"
ethnum = { version = "1.5.2", features = ["serde", "macros"] }
fast-float2 = "0.2.3"
fastrace = { version = "0.7", features = ["enable"] }
indent = "0.1.1"
itertools = "0.13"
logos = "0.12.1"
nom = "8.0.0"
nom-rule = "0.5.1"
ordered-float = { version = "5.1.0", default-features = false }
percent-encoding = "2"
pratt = "0.4.0"
pretty_assertions = "1"
recursive = "0.1.1"
stacker = "0.1.22"
rspack-codespan-reporting = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.10"
strum = "0.24.1"
strum_macros = "0.24"
unindent = "0.2"
url = "2"

# Configuration system
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
dirs = "5.0"
bytesize = { version = "1.3", features = ["serde"] }
humantime-serde = "1.1"
# Dev dependencies for parser
divan = "0.1"
goldenfile = "1"
serial_test = "3.2"

# Internal crate dependencies
paro-common = { path = "crates/common" }
paro-parser = { path = "crates/parser" }
paro-storage = { path = "crates/storage" }
paro-catalog = { path = "crates/catalog" }
paro-context = { path = "crates/context" }
paro-function = { path = "crates/function" }
paro-routine = { path = "crates/routine" }
paro-external-abi = { path = "crates/external_abi" }
paro-external-runtime = { path = "crates/external_runtime" }
paro-planner = { path = "crates/planner" }
paro-optimizer = { path = "crates/optimizer" }
paro-execution = { path = "crates/execution" }
paro-compiler = { path = "crates/compiler" }
paro-scheduler = { path = "crates/scheduler" }
paro-session = { path = "crates/session" }
paro-server = { path = "crates/server" }
paro-instance = { path = "crates/instance" }
paro-journal = { path = "crates/journal" }

[profile.dev.package.paro-parser]
debug = 0
incremental = false

[profile.dev.package.paro-server]
debug = 0
incremental = false

[profile.test.package.paro-parser]
debug = 0
incremental = false

[profile.test.package.paro-server]
debug = 0
incremental = false
