name: benchmark-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-release:
    name: build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-nightly-release
      - run: cargo build --release -p paro-server --bin parod --locked
      - uses: actions/upload-artifact@v4
        with:
          name: parod-release
          path: target/release/parod
          retention-days: 1

  benchmark-regression:
    name: benchmark regression
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r benchmark/requirements.txt
      - id: start_parod
        uses: ./.github/actions/start-parod
        with:
          artifact-name: parod-release
          port: "6432"
          health-timeout: "60"
      - name: Run benchmark regression check
        env:
          PARO_HOST: ${{ steps.start_parod.outputs.host }}
          PARO_PORT: ${{ steps.start_parod.outputs.port }}
        run: |
          if [ -f benchmark/baselines/nightly-linux-amd64.json ]; then
            make -C benchmark check SUITE=nightly-full BASELINE=baselines/nightly-linux-amd64.json
          else
            echo "benchmark/baselines/nightly-linux-amd64.json not found; running nightly suite without regression gate"
            make -C benchmark run SUITE=nightly-full
          fi
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-nightly-report
          if-no-files-found: warn
          path: |
            benchmark/report/result.json
            benchmark/report/summary.md
            .ci/parod.log
      - name: Stop parod
        if: always()
        run: |
          if [ -f .ci/parod.pid ]; then
            kill "$(cat .ci/parod.pid)" || true
            wait "$(cat .ci/parod.pid)" 2>/dev/null || true
          fi
