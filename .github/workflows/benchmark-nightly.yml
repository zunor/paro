name: benchmark-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.92.0

jobs:
  build-release:
    name: build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-nightly-release
      - run: cargo build --release -p paro-server --bin parod --locked
      - uses: actions/upload-artifact@v4
        with:
          name: parod-release
          path: target/release/parod
          retention-days: 1

  benchmark-regression:
    name: benchmark regression
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 100
    concurrency:
      group: perf-archive-${{ vars.PARO_PERF_ARCHIVE_REPOSITORY || github.run_id }}-write
      cancel-in-progress: false
    env:
      PARO_BENCH_CARGO_PROFILE: release
      PARO_BENCH_DATA_DIR_MODE: fresh
      PARO_PERF_ARCHIVE_DIR: ${{ github.workspace }}/.ci/paro-perf-archive
      PARO_PERF_ARCHIVE_TOKEN: ${{ secrets.PARO_PERF_ARCHIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-nightly
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r benchmark/requirements.txt
      - id: start_parod
        uses: ./.github/actions/start-parod
        with:
          artifact-name: parod-release
          port: "6432"
          health-timeout: "60"
      - name: Checkout performance archive
        if: vars.PARO_PERF_ARCHIVE_REPOSITORY != ''
        uses: ./.github/actions/checkout-perf-archive
        with:
          repository: ${{ vars.PARO_PERF_ARCHIVE_REPOSITORY }}
          token: ${{ env.PARO_PERF_ARCHIVE_TOKEN }}
          path: .ci/paro-perf-archive
      - name: Run nightly benchmark suite
        env:
          PARO_HOST: ${{ steps.start_parod.outputs.host }}
          PARO_PORT: ${{ steps.start_parod.outputs.port }}
          PARO_PID: ${{ steps.start_parod.outputs.pid }}
        run: make -C benchmark run SUITE=nightly-full PID="$PARO_PID"
      - name: Sync nightly performance archive
        if: vars.PARO_PERF_ARCHIVE_REPOSITORY != '' && env.PARO_PERF_ARCHIVE_TOKEN != ''
        run: git -C .ci/paro-perf-archive pull --ff-only
      - name: Append nightly performance archive
        if: vars.PARO_PERF_ARCHIVE_REPOSITORY != '' && env.PARO_PERF_ARCHIVE_TOKEN != ''
        env:
          PARO_HOST: ${{ steps.start_parod.outputs.host }}
          PARO_PORT: ${{ steps.start_parod.outputs.port }}
          PARO_PID: ${{ steps.start_parod.outputs.pid }}
        run: |
          make -C benchmark calibrate \
            GATE=operator-runtime \
            PID="$PARO_PID" \
            RUN_ID="nightly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-operator-runtime"
          make -C benchmark calibrate \
            GATE=divan-dispatch \
            RUN_ID="nightly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-divan-dispatch"
      - name: Rebuild nightly performance archive index
        if: vars.PARO_PERF_ARCHIVE_REPOSITORY != '' && env.PARO_PERF_ARCHIVE_TOKEN != ''
        run: |
          for gate in operator-runtime divan-dispatch; do
            make -C benchmark archive-finalize-calibration \
              GATE="$gate" \
              ARCHIVE="$PARO_PERF_ARCHIVE_DIR" \
              PLATFORM=auto \
              POLICY_VERSION=auto
          done
      - name: Commit nightly performance archive updates
        if: vars.PARO_PERF_ARCHIVE_REPOSITORY != '' && env.PARO_PERF_ARCHIVE_TOKEN != ''
        uses: ./.github/actions/commit-changes
        with:
          path: .ci/paro-perf-archive
          add-paths: results calibrations manifests
          message: Archive nightly performance calibration ${{ github.sha }} run=${{ github.run_id }}-${{ github.run_attempt }} gates=operator-runtime,divan-dispatch
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-nightly-report
          if-no-files-found: warn
          path: |
            benchmark/report/**
            .ci/parod.log
      - name: Stop parod
        if: always()
        uses: ./.github/actions/cleanup-parod
