name: policy-evolution

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "benchmark/policies/**"
      - "benchmark/baselines/**"
      - ".github/actions/**"
      - ".github/workflows/policy-evolution.yml"
      - "tools/ci/check_policy_evolution.py"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-evolution-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.92.0
  PARO_POLICY_EVOLUTION_GATES: ${{ vars.PARO_POLICY_EVOLUTION_GATES }}
  PARO_POLICY_EVOLUTION_PLATFORMS: ${{ vars.PARO_POLICY_EVOLUTION_PLATFORMS }}
  PARO_POLICY_EVOLUTION_REQUIRED_PLATFORMS: ${{ vars.PARO_POLICY_EVOLUTION_REQUIRED_PLATFORMS }}
  PARO_PERF_ARCHIVE_DIR: ${{ github.workspace }}/.ci/paro-perf-archive
  PARO_PERF_ARCHIVE_TOKEN: ${{ secrets.PARO_PERF_ARCHIVE_TOKEN }}
  PARO_BENCH_CARGO_PROFILE: release
  PARO_BENCH_DATA_DIR_MODE: fresh

jobs:
  guard:
    name: policy evolution guard
    if: contains(github.event.pull_request.labels.*.name, 'policy-evolution')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout performance archive
        if: vars.PARO_PERF_ARCHIVE_REPOSITORY != ''
        uses: ./.github/actions/checkout-perf-archive
        with:
          repository: ${{ vars.PARO_PERF_ARCHIVE_REPOSITORY }}
          token: ${{ env.PARO_PERF_ARCHIVE_TOKEN }}
          path: .ci/paro-perf-archive
      - name: Validate enforced platform coverage
        run: |
          python3 tools/ci/check_policy_evolution.py \
            --available-platforms "${PARO_POLICY_EVOLUTION_PLATFORMS:-linux-amd64}" \
            --required-platforms "${PARO_POLICY_EVOLUTION_REQUIRED_PLATFORMS:-linux-amd64,macos-arm64}"

  build-release:
    name: build policy-evolution parod
    if: |
      contains(github.event.pull_request.labels.*.name, 'policy-evolution') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (vars.PARO_POLICY_EVOLUTION_PLATFORMS == '' || contains(vars.PARO_POLICY_EVOLUTION_PLATFORMS, 'linux-amd64'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: policy-evolution-release
      - run: cargo build --release -p paro-server --bin parod --locked
      - uses: actions/upload-artifact@v4
        with:
          name: parod-policy-evolution
          path: target/release/parod
          retention-days: 1

  bless-linux-amd64:
    name: bless linux-amd64 baselines
    needs: [guard, build-release]
    if: |
      contains(github.event.pull_request.labels.*.name, 'policy-evolution') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (vars.PARO_POLICY_EVOLUTION_PLATFORMS == '' || contains(vars.PARO_POLICY_EVOLUTION_PLATFORMS, 'linux-amd64'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: policy-evolution-bless
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r benchmark/requirements.txt
      - id: start_parod
        uses: ./.github/actions/start-parod
        with:
          artifact-name: parod-policy-evolution
          port: "6432"
          health-timeout: "60"
      - name: Refresh baselines
        env:
          PARO_HOST: ${{ steps.start_parod.outputs.host }}
          PARO_PORT: ${{ steps.start_parod.outputs.port }}
          PARO_PID: ${{ steps.start_parod.outputs.pid }}
        run: |
          IFS=',' read -r -a gates <<< "${PARO_POLICY_EVOLUTION_GATES:-operator-runtime,divan-dispatch}"
          for gate in "${gates[@]}"; do
            gate="${gate//[[:space:]]/}"
            if [ -z "$gate" ]; then
              continue
            fi
            make -C benchmark bless \
              GATE="$gate" \
              PID="$PARO_PID" \
              POLICY_EVOLUTION=1 \
              BLESS_RUNS=3
          done
      - name: Commit refreshed baselines
        uses: ./.github/actions/commit-changes
        with:
          add-paths: benchmark/baselines
          message: Refresh linux-amd64 policy-evolution baselines
          branch: ${{ github.event.pull_request.head.ref }}
      - name: Stop parod
        if: always()
        uses: ./.github/actions/cleanup-parod

  bless-macos-arm64:
    name: bless macos-arm64 baselines
    needs: [guard, bless-linux-amd64]
    if: |
      contains(github.event.pull_request.labels.*.name, 'policy-evolution') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(vars.PARO_POLICY_EVOLUTION_PLATFORMS, 'macos-arm64')
    runs-on: ${{ vars.PARO_POLICY_EVOLUTION_MACOS_RUNNER || 'macos-14' }}
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: policy-evolution-macos
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build local parod
        run: cargo build --release -p paro-server --bin parod --locked
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r benchmark/requirements.txt
      - id: start_parod
        uses: ./.github/actions/start-parod
        with:
          binary-path: target/release/parod
          port: "6432"
          health-timeout: "60"
      - name: Refresh baselines
        env:
          PARO_HOST: ${{ steps.start_parod.outputs.host }}
          PARO_PORT: ${{ steps.start_parod.outputs.port }}
          PARO_PID: ${{ steps.start_parod.outputs.pid }}
        run: |
          IFS=',' read -r -a gates <<< "${PARO_POLICY_EVOLUTION_GATES:-operator-runtime,divan-dispatch}"
          for gate in "${gates[@]}"; do
            gate="${gate//[[:space:]]/}"
            if [ -z "$gate" ]; then
              continue
            fi
            make -C benchmark bless \
              GATE="$gate" \
              PID="$PARO_PID" \
              POLICY_EVOLUTION=1 \
              BLESS_RUNS=3
          done
      - name: Commit refreshed baselines
        uses: ./.github/actions/commit-changes
        with:
          add-paths: benchmark/baselines
          message: Refresh macos-arm64 policy-evolution baselines
          branch: ${{ github.event.pull_request.head.ref }}
      - name: Stop parod
        if: always()
        uses: ./.github/actions/cleanup-parod
