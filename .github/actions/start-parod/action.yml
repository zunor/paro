name: Start parod
description: Download parod artifact and start the server

inputs:
  artifact-name:
    description: Artifact name containing the parod binary
    default: parod-release
  binary-path:
    description: Optional local parod binary path; skips artifact download when set
    default: ""
  port:
    description: TCP port to bind parod on
    default: "6432"
  health-timeout:
    description: Seconds to wait for the listener to become reachable
    default: "60"

outputs:
  host:
    description: IPv4 loopback host for downstream jobs
    value: "127.0.0.1"
  port:
    description: TCP port for downstream jobs
    value: ${{ inputs.port }}
  pid:
    description: Process id for the started parod server
    value: ${{ steps.start.outputs.pid }}

runs:
  using: composite
  steps:
    - name: Download parod artifact
      if: inputs.binary-path == ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: .ci/bin

    - name: Use local parod binary
      if: inputs.binary-path != ''
      shell: bash
      run: |
        mkdir -p .ci/bin
        cp "${{ inputs.binary-path }}" .ci/bin/parod

    - name: Mark parod executable
      shell: bash
      run: chmod +x .ci/bin/parod

    - name: Start parod
      id: start
      shell: bash
      run: |
        mkdir -p .ci
        rm -rf .ci/parod-data
        mkdir -p .ci/parod-data
        .ci/bin/parod \
          --listen 127.0.0.1:${{ inputs.port }} \
          --data-dir .ci/parod-data \
          > .ci/parod.log 2>&1 &
        pid=$!
        echo "$pid" > .ci/parod.pid
        echo "pid=$pid" >> "$GITHUB_OUTPUT"

    - name: Wait for parod
      shell: bash
      env:
        PAROD_HOST: 127.0.0.1
        PAROD_PORT: ${{ inputs.port }}
        PAROD_TIMEOUT: ${{ inputs.health-timeout }}
      run: |
        python3 tools/ci/wait_for_parod.py \
          --host "$PAROD_HOST" \
          --port "$PAROD_PORT" \
          --pid-file .ci/parod.pid \
          --timeout "$PAROD_TIMEOUT" \
          --log .ci/parod.log
